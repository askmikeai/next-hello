# Grafana dashboard provisioning

apiVersion: 1

providers:
  - name: 'NextHello Dashboards'
    orgId: 1
    folder: 'NextHello'
    folderUid: 'nexthello'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
