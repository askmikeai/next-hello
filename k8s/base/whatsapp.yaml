apiVersion: v1
kind: Service
metadata:
  name: whatsapp
  namespace: nexthello
spec:
  ports:
    - port: 3000
  selector:
    app: whatsapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp
  namespace: nexthello
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatsapp
  template:
    metadata:
      labels:
        app: whatsapp
    spec:
      containers:
        - name: whatsapp
          image: OCIR_REGION.ocir.io/OCIR_NAMESPACE/nexthello-whatsapp:latest
          ports:
            - containerPort: 3000
          env:
            - name: PYTHON_API_URL
              value: "http://api:8001"
            - name: HTTP_PORT
              value: "3000"
            - name: SESSION_ID
              value: "askmikeai-gmail.com"
            - name: NEXTHELLO_SYSTEM_OWNER_ID
              value: "askmikeai@gmail.com"
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexthello-config
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      imagePullSecrets:
        - name: ocir-pull-secret
