apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: nexthello
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nexthello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: OCIR_REGION.ocir.io/OCIR_NAMESPACE/nexthello-api:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: nexthello-config
            - secretRef:
                name: nexthello-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      imagePullSecrets:
        - name: ocir-pull-secret
