# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  NextHello - AI-Powered Networking Assistant
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#  QUICK START:
#  ────────────
#    1. Copy .env.example to .env and fill in your values
#       cp .env.example .env
#
#    2. Start database and run migrations:
#       docker compose up -d postgres redis
#       npm run db:migrate
#
#    3. Connect WhatsApp (scan QR code):
#       docker compose run --rm whatsapp-connect
#
#    4. Start all services:
#       docker compose up -d
#
#  COMMANDS:
#  ─────────
#    View logs:       docker compose logs -f api
#    View all logs:   docker compose logs -f
#    Check status:    docker compose ps
#    Stop services:   docker compose down
#    Dashboard:       http://localhost:8001/admin/
#    API Docs:        http://localhost:8001/docs
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ──────────────────────────────────────────────────────────────────────────
  # POSTGRESQL - Primary database
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexthello-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexthello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexthello_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexthello -d nexthello"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # REDIS - State management and job queues
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexthello-redis
    command: redis-server --appendonly yes
    volumes:
      - nexthello-redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────────────
  # LIQUIBASE - Database migrations
  # Usage: docker compose --profile migrations run --rm liquibase
  # ──────────────────────────────────────────────────────────────────────────
  liquibase:
    image: liquibase/liquibase:4.25
    container_name: nexthello-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/liquibase:/liquibase/changelog
    command: >
      --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexthello}
      --username=${POSTGRES_USER:-nexthello}
      --password=${POSTGRES_PASSWORD:-nexthello_dev}
      --changelog-file=changelog.xml
      update
    profiles:
      - migrations

  # ──────────────────────────────────────────────────────────────────────────
  # API - Python FastAPI + CrewAI server
  # Dashboard: http://localhost:8001/admin/
  # API Docs:  http://localhost:8001/docs
  # ──────────────────────────────────────────────────────────────────────────
  api:
    build: ./crewai
    image: nexthello-api:local
    container_name: nexthello-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
      SUPABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
      FRONTEND_DIR: /app/frontend
    volumes:
      - nexthello-media:/app/data/media
      - ./dist/src/admin:/app/frontend:ro
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # WORKER - ARQ background job processor
  # Handles async tasks: AI processing, enrichment, video/voice generation
  # ──────────────────────────────────────────────────────────────────────────
  worker:
    build: ./crewai
    image: nexthello-api:local
    container_name: nexthello-worker
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-media:/app/data/media
    command: ["python", "-m", "arq", "src.queue.worker.WorkerSettings"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # SWARM - Autonomous agent swarm
  # True swarm architecture with peer-to-peer agent coordination
  # ──────────────────────────────────────────────────────────────────────────
  swarm:
    build: ./crewai
    image: nexthello-api:local
    container_name: nexthello-swarm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-media:/app/data/media
    command: ["python", "-m", "src.swarm.runner"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # WHATSAPP-BRIDGE - Node.js Baileys WhatsApp connector
  # Forwards messages to Python API
  # ──────────────────────────────────────────────────────────────────────────
  whatsapp-bridge:
    build: ./crewai/whatsapp-bridge
    image: nexthello-whatsapp:local
    container_name: nexthello-whatsapp-bridge
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PYTHON_API_URL: http://api:8001
      HTTP_PORT: 3000
      SESSION_ID: ${WHATSAPP_SESSION_ID:-default}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-whatsapp-auth:/app/auth_state
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # WHATSAPP-CONNECT - Interactive QR code scanner
  # Usage: docker compose run --rm whatsapp-connect
  # ──────────────────────────────────────────────────────────────────────────
  whatsapp-connect:
    build: ./crewai/whatsapp-bridge
    image: nexthello-whatsapp:local
    container_name: nexthello-whatsapp-connect
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHON_API_URL: http://api:8001
      QR_OUTPUT_DIR: /qr
      SESSION_ID: ${WHATSAPP_SESSION_ID:-default}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-whatsapp-auth:/app/auth_state
      - /tmp:/qr
    profiles:
      - tools

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VOLUMES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  nexthello-postgres:
    name: nexthello-postgres
  nexthello-redis:
    name: nexthello-redis
  nexthello-media:
    name: nexthello-media
  nexthello-whatsapp-auth:
    name: nexthello-whatsapp-auth

networks:
  default:
    name: nexthello-network
