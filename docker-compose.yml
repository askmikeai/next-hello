# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  NextHello - AI-Powered Networking Assistant
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#  QUICK START:
#  ────────────
#    1. Copy .env.example to .env and fill in your values
#       cp .env.example .env
#
#    2. Start database and run migrations:
#       docker compose up -d postgres redis
#       npm run db:migrate
#
#    3. Connect WhatsApp (scan QR code):
#       docker compose run --rm whatsapp-connect
#
#    4. Start all services:
#       docker compose up -d
#
#  COMMANDS:
#  ─────────
#    View logs:       docker compose logs -f api
#    View all logs:   docker compose logs -f
#    Check status:    docker compose ps
#    Stop services:   docker compose down
#    API Docs:        http://localhost:8001/docs
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ──────────────────────────────────────────────────────────────────────────
  # POSTGRESQL - Primary database
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexthello-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexthello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexthello_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexthello -d nexthello"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # REDIS - State management and job queues
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexthello-redis
    command: redis-server --appendonly yes
    volumes:
      - nexthello-redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────────────
  # LIQUIBASE - Database migrations
  # Usage: docker compose --profile migrations run --rm liquibase
  # ──────────────────────────────────────────────────────────────────────────
  liquibase:
    image: liquibase/liquibase:4.25
    container_name: nexthello-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/liquibase:/liquibase/changelog
    command: >
      --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexthello}
      --username=${POSTGRES_USER:-nexthello}
      --password=${POSTGRES_PASSWORD:-nexthello_dev}
      --changelog-file=changelog.xml
      update
    profiles:
      - migrations

  # ──────────────────────────────────────────────────────────────────────────
  # API - Python FastAPI + CrewAI server
  # API Docs:  http://localhost:8001/docs
  # ──────────────────────────────────────────────────────────────────────────
  api:
    build: ./crewai
    image: nexthello-api:local
    container_name: nexthello-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
      SUPABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
      WHATSAPP_CONNECTOR_URL: http://whatsapp:3000
      WHATSAPP_CONNECTOR_MAP_JSON: '{}'
    volumes:
      - nexthello-media:/app/data/media
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # WORKER - ARQ background job processor
  # Handles async tasks: AI processing, enrichment, video/voice generation
  # ──────────────────────────────────────────────────────────────────────────
  worker:
    build: ./crewai
    image: nexthello-api:local
    container_name: nexthello-worker
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-media:/app/data/media
    command: ["python", "-m", "arq", "src.queue.worker.WorkerSettings"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # SWARM - Autonomous agent swarm
  # True swarm architecture with peer-to-peer agent coordination
  # ──────────────────────────────────────────────────────────────────────────
  swarm:
    build: ./crewai
    image: nexthello-api:local
    container_name: nexthello-swarm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-media:/app/data/media
    ports:
      - "9108:9108"
    command: ["python", "-m", "src.swarm.runner"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # WHATSAPP - Node.js Baileys WhatsApp connector
  # Forwards messages to Python API
  # ──────────────────────────────────────────────────────────────────────────
  whatsapp:
    build: ./crewai/whatsapp-bridge
    image: nexthello-whatsapp:local
    container_name: nexthello-whatsapp
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHON_API_URL: http://api:8001
      HTTP_PORT: 3000
      SESSION_ID: askmikeai-gmail.com
      NEXTHELLO_SYSTEM_OWNER_ID: askmikeai@gmail.com
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-whatsapp-auth:/app/auth_state
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # WHATSAPP-CONNECT - Interactive QR code scanner
  # Usage: docker compose run --rm whatsapp-connect
  # ──────────────────────────────────────────────────────────────────────────
  whatsapp-connect:
    build: ./crewai/whatsapp-bridge
    image: nexthello-whatsapp:local
    container_name: nexthello-whatsapp-connect
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHON_API_URL: http://api:8001
      QR_OUTPUT_DIR: /qr
      SESSION_ID: ${WHATSAPP_SESSION_ID:-default}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexthello}:${POSTGRES_PASSWORD:-nexthello_dev}@postgres:5432/${POSTGRES_DB:-nexthello}
    volumes:
      - nexthello-whatsapp-auth:/app/auth_state
      - /tmp:/qr
    profiles:
      - tools

  # ──────────────────────────────────────────────────────────────────────────
  # AGENT-LOG-MONITOR - Centralized error monitoring for agent containers
  # Watches Docker logs and emits only error/failure lines.
  # View: docker compose logs -f agent-log-monitor
  # ──────────────────────────────────────────────────────────────────────────
  agent-log-monitor:
    image: timberio/vector:0.40.1-alpine
    container_name: nexthello-agent-log-monitor
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/vector-agent-errors.toml:/etc/vector/vector.toml:ro
      - nexthello-agent-errors:/var/log/agent-errors
    command: ["--config", "/etc/vector/vector.toml"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # LOKI - Log storage backend for Grafana Explore
  # UI query endpoint: http://localhost:3100
  # ──────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.1
    container_name: nexthello-loki
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/config.yml:ro
      - nexthello-loki:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # PROMETHEUS - Metrics storage and scraping
  # UI query endpoint: http://localhost:9090
  # ──────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nexthello-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nexthello-prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────────────────────
  # GRAFANA - UI for Loki logs and dashboards
  # UI: http://localhost:3002
  # Login: admin / admin (change via env in production)
  # ──────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.4
    container_name: nexthello-grafana-ui
    depends_on:
      - loki
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - nexthello-grafana:/var/lib/grafana
    ports:
      - "3002:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VOLUMES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  nexthello-postgres:
    name: nexthello-postgres
  nexthello-redis:
    name: nexthello-redis
  nexthello-media:
    name: nexthello-media
  nexthello-whatsapp-auth:
    name: nexthello-whatsapp-auth
  nexthello-agent-errors:
    name: nexthello-agent-errors
  nexthello-loki:
    name: nexthello-loki
  nexthello-grafana:
    name: nexthello-grafana
  nexthello-prometheus:
    name: nexthello-prometheus

networks:
  default:
    name: nexthello-network
