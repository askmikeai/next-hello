name: Deploy Production

on:
  push:
    branches:
      - main
      - fix/admin-contract
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to OCI VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync application files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          source: "."
          target: ${{ secrets.PROD_APP_DIR || '/opt/nexthello/app' }}
          overwrite: true
          strip_components: 0
          rm: false
          tar_dereference: true
          exclude: >-
            .git,
            .github,
            **/.DS_Store,
            **/.env,
            **/node_modules,
            **/.venv,
            **/__pycache__,
            **/*.pyc,
            ui/dist,
            ui/tsconfig.tsbuildinfo

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.PROD_APP_DIR || '/opt/nexthello/app' }}"
            cd "$APP_DIR"

            docker compose up -d postgres redis
            docker compose --profile migrations run --rm liquibase
            docker compose up -d --build api worker swarm whatsapp ui agent-log-monitor loki
            docker compose ps
