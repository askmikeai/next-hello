name: Deploy Production

on:
  push:
    branches:
      - main
      - fix/admin-contract
      - oci-terraform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to OCI VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install UI dependencies
        working-directory: ui
        run: npm cache clean --force && npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Sync application files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          source: "."
          target: ${{ secrets.PROD_APP_DIR || '/opt/nexthello/app' }}
          overwrite: true
          strip_components: 0
          rm: false
          tar_dereference: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.PROD_APP_DIR || '/opt/nexthello/app' }}"
            cd "$APP_DIR"

            docker compose up -d postgres redis
            docker compose --profile migrations run --rm liquibase

            # Always rebuild UI on the server so deployed assets match HEAD.
            if [ -d "ui" ]; then
              cd ui
              npm cache clean --force || true
              npm ci
              npm run build
              cd "$APP_DIR"
            fi

            SERVICES="api worker swarm whatsapp agent-log-monitor loki"

            # Optional services based on branch/environment compose config.
            if docker compose config --services | grep -q '^whatsapp-hollywood$'; then
              SERVICES="$SERVICES whatsapp-hollywood"
            fi
            if docker compose config --services | grep -q '^ui$'; then
              SERVICES="$SERVICES ui"
            fi

            docker compose up -d --build $SERVICES

            # If UI is served by a standalone nginx container, force-refresh assets.
            if docker ps -a --format '{{.Names}}' | grep -q '^nexthello-ui$'; then
              docker cp "$APP_DIR/ui/dist/." nexthello-ui:/usr/share/nginx/html/
              docker restart nexthello-ui
            fi

            # If UI is served directly by host nginx, refresh /var/www/html when present.
            if [ -d "/var/www/html" ] && [ -d "$APP_DIR/ui/dist" ]; then
              rm -rf /var/www/html/*
              cp -R "$APP_DIR/ui/dist/." /var/www/html/
              (systemctl reload nginx || true)
            fi

            docker compose ps
