<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#00D4AA"/>
    </linearGradient>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0066FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#mainGradient)" filter="url(#shadow)"/>

  <!-- Speech bubble shape -->
  <path d="M120 140
           C120 115, 140 95, 170 95
           L270 95
           C300 95, 320 115, 320 140
           L320 220
           C320 245, 300 265, 270 265
           L190 265
           L150 305
           L160 265
           L170 265
           C140 265, 120 245, 120 220
           Z"
        fill="white"
        opacity="0.95"/>

  <!-- Connection nodes inside bubble -->
  <!-- Center node -->
  <circle cx="220" cy="175" r="28" fill="url(#mainGradient)"/>

  <!-- Top-left node -->
  <circle cx="155" cy="145" r="18" fill="url(#mainGradient)" opacity="0.8"/>

  <!-- Top-right node -->
  <circle cx="275" cy="155" r="15" fill="url(#mainGradient)" opacity="0.7"/>

  <!-- Bottom node -->
  <circle cx="180" cy="225" r="16" fill="url(#mainGradient)" opacity="0.75"/>

  <!-- Connection lines -->
  <line x1="220" y1="175" x2="155" y2="145" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
  <line x1="220" y1="175" x2="275" y2="155" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
  <line x1="220" y1="175" x2="180" y2="225" stroke="url(#mainGradient)" stroke-width="3" opacity="0.5"/>
  <line x1="155" y1="145" x2="180" y2="225" stroke="url(#mainGradient)" stroke-width="2" opacity="0.3"/>

  <!-- Checkmark/wave accent on center node -->
  <path d="M208 175 L216 183 L235 164"
        stroke="white"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
</svg>