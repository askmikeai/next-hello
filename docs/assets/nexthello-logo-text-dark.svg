<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#00D4AA"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square with speech bubble -->
  <rect x="10" y="10" width="100" height="100" rx="22" fill="url(#brandGradient)"/>

  <!-- Mini speech bubble -->
  <path d="M30 35
           C30 28, 36 22, 45 22
           L85 22
           C94 22, 100 28, 100 35
           L100 65
           C100 72, 94 78, 85 78
           L55 78
           L38 95
           L42 78
           L45 78
           C36 78, 30 72, 30 65
           Z"
        fill="white"/>

  <!-- Connected N inside -->
  <circle cx="48" cy="42" r="6" fill="url(#brandGradient)"/>
  <circle cx="48" cy="62" r="6" fill="url(#brandGradient)"/>
  <circle cx="78" cy="42" r="6" fill="url(#brandGradient)"/>
  <circle cx="78" cy="62" r="6" fill="url(#brandGradient)"/>
  <line x1="48" y1="42" x2="48" y2="62" stroke="url(#brandGradient)" stroke-width="3"/>
  <line x1="48" y1="42" x2="78" y2="62" stroke="url(#brandGradient)" stroke-width="3"/>
  <line x1="78" y1="42" x2="78" y2="62" stroke="url(#brandGradient)" stroke-width="3"/>

  <!-- Text: NextHello (white for dark mode) -->
  <text x="130" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="700">
    <tspan fill="url(#brandGradient)">Next</tspan><tspan fill="#ffffff">Hello</tspan>
  </text>
</svg>