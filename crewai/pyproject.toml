[project]
name = "nexthello-crewai"
version = "1.0.0"
description = "CrewAI-based multi-agent networking assistant with WhatsApp integration"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # CrewAI and AI
    "crewai[tools,anthropic]>=0.152.0",
    "litellm>=1.58.0",

    # Web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",

    # HTTP client
    "httpx>=0.27.0",

    # QR rendering
    "qrcode[pil]>=7.4.2",

    # Redis and job queue
    "redis>=5.0.0",
    "arq>=0.26.0",

    # Database
    "supabase>=2.0.0",
    "asyncpg>=0.29.0",

    # External APIs (optional, for tools)
    "openai>=1.0.0",  # For Whisper transcription
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "fakeredis>=2.20.0",
]

[project.scripts]
nexthello = "main:main"
nexthello-worker = "src.queue.worker:WorkerSettings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
